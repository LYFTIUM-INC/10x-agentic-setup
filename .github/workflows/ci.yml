name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters and scanners
        run: |
          pip install ruff==0.5.6 pip-audit==2.7.3

      - name: Lint shared utils
        run: |
          ruff check mcp_servers/shared/src || true

      - name: Security scan (pip-audit)
        run: |
          if [ -f mcp_servers/requirements.txt ]; then pip-audit -r mcp_servers/requirements.txt || true; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        working-directory: mcp_servers
        run: |
          docker build -t ml-enhanced-mcps-base:latest -f docker/Dockerfile.base .

      - name: Build all service images
        working-directory: mcp_servers
        run: |
          docker compose build

      - name: Start services
        working-directory: mcp_servers
        run: |
          docker compose up -d

      - name: Wait for health
        run: |
          for url in \
            http://localhost:8001/health \
            http://localhost:8002/health \
            http://localhost:8003/health \
            http://localhost:8004/health \
            http://localhost:8005/health \
            http://localhost:8006/health \
            http://localhost:8007/health \
            http://localhost:8008/health; do \
              echo "Checking $url"; \
              for i in {1..20}; do \
                if curl -fsS "$url" >/dev/null; then echo "OK $url"; break; fi; \
                sleep 3; \
              done; \
            done

      - name: Compose logs on failure
        if: failure()
        working-directory: mcp_servers
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Shutdown
        if: always()
        working-directory: mcp_servers
        run: |
          docker compose down -v