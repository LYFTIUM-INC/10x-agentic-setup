      context: .
      dockerfile: command_analytics/Dockerfile
    image: 10x-command-analytics:latest
    container_name: 10x-command-analytics
    ports:
      - "8007:8007"
    volumes:
      - ./data/command_analytics:/data/command_analytics
      - ${PROJECT_ROOT:-..}/.claude/commands:/.claude/commands:ro  # Mount commands folder
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 10X Workflow Optimizer MCP Server
  workflow-optimizer:
    build:
      context: .
      dockerfile: workflow_optimizer/Dockerfile
    image: 10x-workflow-optimizer:latest
    container_name: 10x-workflow-optimizer
    ports:
      - "8005:8005"
    volumes:
      - ./data/workflow_optimizer:/data/workflow_optimizer
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Agentic Workflow MCP Server
  agentic-workflow:
    build:
      context: .
      dockerfile: agentic_workflow/Dockerfile
    image: agentic-workflow:latest
    container_name: agentic-workflow
    ports:
      - "8003:8003"
    volumes:
      - ./data/agentic_workflow:/data/agentic_workflow
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Predictive Analytics MCP Server
  predictive-analytics:
    build:
      context: .
      dockerfile: predictive_analytics/Dockerfile
    image: predictive-analytics:latest
    container_name: predictive-analytics
    ports:
      - "8004:8004"
    volumes:
      - ./data/predictive_analytics:/data/predictive_analytics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Testing QA MCP Server
  ml-testing-qa:
    build:
      context: .
      dockerfile: ml_testing_qa/Dockerfile
    image: ml-testing-qa:latest
    container_name: ml-testing-qa
    ports:
      - "8008:8008"
    volumes:
      - ./data/ml_testing_qa:/data/ml_testing_qa
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: ml-mcp-network
    driver: bridge

volumes:
  ml_code_intelligence_data:
  context_aware_memory_data:
  knowledge_graph_data:
  command_analytics_data:
  workflow_optimizer_data:
  agentic_workflow_data:
  predictive_analytics_data:
  ml_testing_qa_data: